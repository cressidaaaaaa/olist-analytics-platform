version: 2

models:
  - name: dim_customer
    description: "One row per customer_id. Olist creates one customer_id per order; customer_unique_id identifies the real person."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: dim_product
    description: "One row per product, with English category name."
    columns:
      - name: product_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: dim_seller
    description: "One row per seller."
    columns:
      - name: seller_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: dim_date
    description: "One row per calendar day, from 2016-01-01 to the end of the current year."
    columns:
      - name: date_day
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    description: "One row per order, with item totals, payments (BRL and EUR), delivery performance and review score."
    columns:
      - name: order_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customer."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: purchase_date
        description: "Foreign key to dim_date."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']

  - name: fct_order_items
    description: "One row per order item, with prices in BRL and EUR. Incremental model."
    columns:
      - name: order_item_key
        description: "Primary key: order_id + '-' + order_item_id."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customer."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_id
        description: "Foreign key to dim_product."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: seller_id
        description: "Foreign key to dim_seller."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id
      - name: purchase_date
        description: "Foreign key to dim_date."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day